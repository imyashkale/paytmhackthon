# MCP servers. Image tag IMAGE_TAG is replaced by `make k8s-deploy`.
# Token: secret mcp-token (key: token), created by `make k8s-deploy` if missing.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-crm
  namespace: mcp
  labels:
    app: mcp-crm
    app.kubernetes.io/part-of: mcp-servers
spec:
  # 1 replica: state is in-memory until real backends are connected.
  replicas: 1
  selector:
    matchLabels:
      app: mcp-crm
  template:
    metadata:
      labels:
        app: mcp-crm
        app.kubernetes.io/part-of: mcp-servers
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: mcp-crm:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-token
                  key: token
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-crm
  namespace: mcp
  labels:
    app.kubernetes.io/part-of: mcp-servers
spec:
  selector:
    app: mcp-crm
  ports:
    - name: http
      port: 80
      targetPort: http
---
